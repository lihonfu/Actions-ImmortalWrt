name: 🚀 编译 (Build)

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'ImmortalWrt 仓库的拥有者 (Owner of ImmortalWrt repo)'
        type: string
        required: true
        default: 'padavanonly'

      repo:
        description: 'ImmortalWrt 仓库的名字 (Name of ImmortalWrt repo)'
        type: string
        required: true
        default: 'immortalwrt-mt798x-6.6'

      branch:
        description: 'ImmortalWrt 仓库的分支 (Branch of ImmortalWrt repo)'
        type: string
        required: true
        default: 'openwrt-24.10-6.6'

      multithreading:
        description: '开启多线程编译 (Enable multithreading build)'
        type: boolean
        default: true

      ssh:
        description: '使用 ssh 连接到编译环境 (Connect to the build environment using ssh)'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build)

    steps:
      - name: 下载编译所需的依赖 (Install build dependencies)
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libz-dev \
            patch \
            perl \
            pkgconf \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            wget \
            xsltproc \
            xz-utils \
            zlib1g-dev

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: '${{ inputs.owner }}/${{ inputs.repo }}'
          ref: ${{ inputs.branch }}
          path: ImmortalWrt

      - name: 复制配置和构建脚本 (Copy configuration and build scripts)
        run: |
          set -eux

          cp -f .config ImmortalWrt/.config
          cp -f feeds.conf.default ImmortalWrt/feeds.conf.default
          cp -f diy.sh ImmortalWrt/diy.sh

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          set -eux

          chmod +x diy.sh
          ./diy.sh

      - name: 更新并安装 feeds (Update and install feeds)
        working-directory: ImmortalWrt
        run: |
          set -eux

          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 删除产生递归依赖的 ksmbd 包 (Remove recursive ksmbd package)
        working-directory: ImmortalWrt
        run: |
          set -eux

          # 当前 feeds 中的 kmod-fs-ksmbd 会生成如下递归依赖：
          #
          # PACKAGE_kmod-fs-ksmbd
          #   selects PACKAGE_kmod-fs-ksmbd
          #
          # 该包不是本次固件编译的必要组件，因此删除其源目录和 feed 链接。
          find feeds package/feeds \
            -type d \
            \( -iname '*ksmbd*' -o -iname '*ksmbd-server*' \) \
            -print \
            -exec rm -rf {} + 2>/dev/null || true

          # 清理配置中可能存在的 ksmbd 选项。
          sed -i -E \
            -e 's/^CONFIG_PACKAGE_kmod-fs-ksmbd=y$/# CONFIG_PACKAGE_kmod-fs-ksmbd is not set/' \
            -e 's/^CONFIG_PACKAGE_ksmbd-server=y$/# CONFIG_PACKAGE_ksmbd-server is not set/' \
            -e 's/^CONFIG_PACKAGE_ksmbd-utils=y$/# CONFIG_PACKAGE_ksmbd-utils is not set/' \
            .config

      - name: 生成最终配置 (Generate final configuration)
        working-directory: ImmortalWrt
        run: |
          set -eux

          # 注意：此处是唯一一次执行 make defconfig。
          # 禁用 GDB 的操作必须放在此命令之后。
          make defconfig

      - name: 禁用 GDB 工具链组件 (Disable GDB)
        working-directory: ImmortalWrt
        run: |
          set -eux

          # make defconfig 会根据 Kconfig 重新生成配置，
          # 因此必须在 make defconfig 之后修改 GDB 选项。
          sed -i -E \
            -e 's/^CONFIG_GDB=y$/# CONFIG_GDB is not set/' \
            -e 's/^CONFIG_GDB_PYTHON=y$/# CONFIG_GDB_PYTHON is not set/' \
            -e 's/^CONFIG_PACKAGE_gdb=y$/# CONFIG_PACKAGE_gdb is not set/' \
            -e 's/^CONFIG_PACKAGE_gdbserver=y$/# CONFIG_PACKAGE_gdbserver is not set/' \
            .config

          # 如果配置中不存在对应项目，则主动追加禁用项。
          grep -q '^CONFIG_GDB=' .config || \
            echo '# CONFIG_GDB is not set' >> .config

          grep -q '^CONFIG_GDB_PYTHON=' .config || \
            echo '# CONFIG_GDB_PYTHON is not set' >> .config

          # 验证 GDB 以及 gdbserver 均未启用。
          if grep -qE '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)=y' .config; then
            echo '错误：GDB 仍然启用'
            grep -E '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)' .config || true
            exit 1
          fi

          echo 'GDB 已成功禁用'
          grep -E '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)' .config || true

      - name: 检查最终配置 (Validate final configuration)
        working-directory: ImmortalWrt
        run: |
          set -eux

          if grep -qE '^CONFIG_PACKAGE_kmod-fs-ksmbd=y|^CONFIG_PACKAGE_ksmbd-server=y|^CONFIG_PACKAGE_ksmbd-utils=y' .config; then
            echo '错误：ksmbd 相关软件包仍然启用'
            grep -E 'ksmbd' .config || true
            exit 1
          fi

          if grep -qE '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)=y' .config; then
            echo '错误：GDB 相关组件仍然启用'
            grep -E '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)' .config || true
            exit 1
          fi

          echo '最终配置检查通过'

      - name: 编译前上传配置 (Upload config before build)
        uses: actions/upload-artifact@v4
        with:
          name: config-before-build
          path: |
            ImmortalWrt/feeds.conf.default
            ImmortalWrt/.config

      - name: 多线程编译 ImmortalWrt (Build ImmortalWrt with multiple threads)
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: |
          set -eux
          make -j"$(nproc)" V=s

      - name: 单线程编译 ImmortalWrt (Build ImmortalWrt with one thread)
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: |
          set -eux
          make -j1 V=s

      - name: 上传编译结果 (Upload build result)
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-build-result
          path: ImmortalWrt/bin/targets


  build-ssh:
    if: ${{ inputs.ssh == true }}
    runs-on: ubuntu-latest
    name: 🚀 编译 (Build) - SSH

    steps:
      - name: 下载编译所需的依赖 (Install build dependencies)
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libz-dev \
            patch \
            perl \
            pkgconf \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            wget \
            xsltproc \
            xz-utils \
            zlib1g-dev

      - name: 克隆当前仓库 (Clone current repo)
        uses: actions/checkout@v4

      - name: 克隆 ImmortalWrt 仓库 (Clone ImmortalWrt repo)
        uses: actions/checkout@v4
        with:
          repository: '${{ inputs.owner }}/${{ inputs.repo }}'
          ref: ${{ inputs.branch }}
          path: ImmortalWrt

      - name: 复制配置和构建脚本 (Copy configuration and build scripts)
        run: |
          set -eux

          cp -f .config ImmortalWrt/.config
          cp -f feeds.conf.default ImmortalWrt/feeds.conf.default
          cp -f diy.sh ImmortalWrt/diy.sh

      - name: 运行 diy.sh (Run diy.sh)
        working-directory: ImmortalWrt
        run: |
          set -eux

          chmod +x diy.sh
          ./diy.sh

      - name: 更新并安装 feeds (Update and install feeds)
        working-directory: ImmortalWrt
        run: |
          set -eux

          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 删除产生递归依赖的 ksmbd 包 (Remove recursive ksmbd package)
        working-directory: ImmortalWrt
        run: |
          set -eux

          find feeds package/feeds \
            -type d \
            \( -iname '*ksmbd*' -o -iname '*ksmbd-server*' \) \
            -print \
            -exec rm -rf {} + 2>/dev/null || true

          sed -i -E \
            -e 's/^CONFIG_PACKAGE_kmod-fs-ksmbd=y$/# CONFIG_PACKAGE_kmod-fs-ksmbd is not set/' \
            -e 's/^CONFIG_PACKAGE_ksmbd-server=y$/# CONFIG_PACKAGE_ksmbd-server is not set/' \
            -e 's/^CONFIG_PACKAGE_ksmbd-utils=y$/# CONFIG_PACKAGE_ksmbd-utils is not set/' \
            .config

      - name: 生成最终配置 (Generate final configuration)
        working-directory: ImmortalWrt
        run: |
          set -eux

          make defconfig

      - name: 开启 SSH 服务 (Start SSH service)
        uses: lhotari/action-upterm@v1
        with:
          wait-timeout-minutes: 20

      - name: 禁用 GDB 工具链组件 (Disable GDB)
        working-directory: ImmortalWrt
        run: |
          set -eux

          sed -i -E \
            -e 's/^CONFIG_GDB=y$/# CONFIG_GDB is not set/' \
            -e 's/^CONFIG_GDB_PYTHON=y$/# CONFIG_GDB_PYTHON is not set/' \
            -e 's/^CONFIG_PACKAGE_gdb=y$/# CONFIG_PACKAGE_gdb is not set/' \
            -e 's/^CONFIG_PACKAGE_gdbserver=y$/# CONFIG_PACKAGE_gdbserver is not set/' \
            .config

          grep -q '^CONFIG_GDB=' .config || \
            echo '# CONFIG_GDB is not set' >> .config

          grep -q '^CONFIG_GDB_PYTHON=' .config || \
            echo '# CONFIG_GDB_PYTHON is not set' >> .config

          if grep -qE '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)=y' .config; then
            echo '错误：GDB 仍然启用'
            grep -E '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)' .config || true
            exit 1
          fi

          echo 'GDB 已成功禁用'
          grep -E '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)' .config || true

      - name: 检查最终配置 (Validate final configuration)
        working-directory: ImmortalWrt
        run: |
          set -eux

          if grep -qE '^CONFIG_PACKAGE_kmod-fs-ksmbd=y|^CONFIG_PACKAGE_ksmbd-server=y|^CONFIG_PACKAGE_ksmbd-utils=y' .config; then
            echo '错误：ksmbd 相关软件包仍然启用'
            grep -E 'ksmbd' .config || true
            exit 1
          fi

          if grep -qE '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)=y' .config; then
            echo '错误：GDB 相关组件仍然启用'
            grep -E '^(CONFIG_GDB|CONFIG_GDB_PYTHON|CONFIG_PACKAGE_gdb|CONFIG_PACKAGE_gdbserver)' .config || true
            exit 1
          fi

          echo '最终配置检查通过'

      - name: 编译前上传配置 (Upload config before build)
